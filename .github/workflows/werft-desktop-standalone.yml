name: Werft desktop standalone (optional)

on:
  push:
    branches: [werft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: werft-desktop-standalone-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  standalone:
    # These diagnostics run on the product branch and by manual dispatch,
    # independently of the pull request checks verified by werft/ci.
    if: github.repository_id == '1473691789'
    name: Optional standalone (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac-arm64
          - os: windows-2025
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - run: npm ci
      - run: npm run plugins:setup
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      # Check the fresh trace before any static copying/curation.
      - run: node scripts/smoke-provider-runtime.mjs
      # Plan map labels fit their boxes in real Chrome, in any font (#671).
      - name: Plan labels fit in real Chrome
        run: |
          # The upstream font-layout smoke can fail intermittently. A retry
          # must pass every assertion in a fresh browser and app server.
          for attempt in 1 2 3; do
            if node scripts/smoke-plan-labels.mjs; then
              exit 0
            fi
            if [[ "$attempt" != "3" ]]; then
              echo "::warning::Plan-label smoke failed on $RUNNER_OS. Retrying the complete test."
            fi
          done
          exit 1
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
