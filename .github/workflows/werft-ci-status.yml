name: Werft feature CI status

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  status:
    if: github.repository_id == '1473691789' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report the ordinary PR CI result
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/werft/feature_status.py
